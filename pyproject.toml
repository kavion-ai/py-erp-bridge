[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "py-erp-bridge"
dynamic = ["version"]
description = "One typed, async-first Python SDK for ten ERP systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "py-erp-bridge contributors" }]
keywords = ["erp", "sap", "netsuite", "oracle", "dynamics", "odoo", "erpnext", "tally", "infor", "intacct"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "tenacity>=8.3,<10",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
# NetSuite machine-to-machine OAuth. SAP RFC has no extra: see docs/sap-rfc.md.
jwt = ["pyjwt[crypto]>=2.8,<3"]
dev = [
  "py-erp-bridge[jwt]",
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
  "types-defusedxml",
]

[tool.hatch.version]
path = "src/py_erp_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/py_erp_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["py_erp_bridge"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "D1", "RUF", "SIM", "ASYNC", "C4", "PT", "RET"]
ignore = ["D107", "S105", "S106", "UP046", "UP047", "UP040", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D", "ANN"]
"examples/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "examples"]
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyrfc.*"]
ignore_missing_imports = true
